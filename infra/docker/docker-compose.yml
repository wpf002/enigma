name: enigma
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: enigma
      POSTGRES_PASSWORD: enigma
      POSTGRES_DB: enigma
    ports: ['${ENIGMA_PG_PORT:-5432}:5432']
    volumes: ['enigma_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enigma -d enigma']
      interval: 2s
      timeout: 3s
      retries: 30

  aact:
    image: postgres:16
    environment:
      POSTGRES_USER: aact
      POSTGRES_PASSWORD: aact
      POSTGRES_DB: aact
    ports: ['${AACT_PG_PORT:-5433}:5432']
    volumes: ['enigma_aact:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aact -d aact']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  enigma_pg:
  enigma_aact:
